    const y = TOP + 400 + G, hh = CH2 - 400 - G, w1 = 520, w3 = 520, w2 = CW - w1 - w3 - 2 * G;
    kids.push(tile(M, y, w1, hh, inside(front, { top: "28px" }), { bg: mix(c.hex, 34), fg: "var(--ink)", text: true }));
    kids.push(tile(M + w1 + G, y, w2, hh, inside(mand, { top: "28px" }), { bg: feature.hex, text: true }));
    kids.push(tile(M + w1 + w2 + 2 * G, y, w3, hh, inside(notes, { top: "28px" }), { bg: "var(--panel)", text: true }));
  } else {
    const x = M + 640 + G, w = CW - 640 - G, h1 = 330;
    kids.push(tile(x, TOP, (w - G) / 2, h1, inside(front, { top: "28px" }), { bg: mix(c.hex, 34), fg: "var(--ink)", text: true }));
    kids.push(tile(x + (w + G) / 2, TOP, (w - G) / 2, h1, inside(notes, { top: "28px" }), { bg: "var(--panel)", text: true }));
    kids.push(tile(x, TOP + h1 + G, w, CH2 - h1 - G, inside(mand, { top: "28px" }), { bg: feature.hex, text: true }));
  }
  return frame(kids, { cap: T.topics.labels });
});

S.print = (code) => {
  const p = B.print;
  const kids = [head(code, "print", sec.print || T.topics.print)];
  const rowsP = [[T.printer, p.printer || T.notChosen], [T.technology, p.technology], [T.pdf, p.pdf], [T.profile, p.profile], [T.bleedL, p.bleed_mm !== undefined ? `${p.bleed_mm} mm` : null], [T.safeL, p.safe_mm !== undefined ? `${p.safe_mm} mm` : null], [T.smallText, p.small_text], [T.finishes, (p.finishes || []).map((x) => `${x.type}${x.colour ? ` (${x.colour})` : ""}${x.layer ? `, ${x.layer}` : ""}`).join("; ")], [T.proofL, p.proof]].filter(([, v]) => v);
  kids.push(tile(M, TOP, 1060, CH2, inside(h("table", { class: "tb" }, h("tbody", {}, rowsP.map(([k, v]) => h("tr", {}, h("td", { style: { width: "300px" } }, k), h("td", {}, v))))), { top: "30px" }), { bg: "var(--panel)", text: true }));
  const steps = LANG === "pl" ? [`Eksport do ${p.pdf || "PDF/X-4"} z profilem ${p.profile || "ustalonym z drukarnią"}.`, `Spad ${p.bleed_mm ?? 3} mm i ${p.safe_mm ?? 3} mm marginesu; potwierdzić z drukarnią.`, (B.labels || []).length ? "Drobny tekst i kod kreskowy w 100% K z nadrukiem." : "Drobny tekst w 100% K z nadrukiem.", "Uszlachetnienia i wykrojnik na osobnych warstwach, jako kolory dodatkowe.", "Wykrojnik od drukarni, nie rysowany na oko.", "Próbny wydruk na docelowym papierze przed zatwierdzeniem koloru."]
    : [`Export to ${p.pdf || "PDF/X-4"} with the ${p.profile || "printer's"} profile.`, `${p.bleed_mm ?? 3} mm bleed and ${p.safe_mm ?? 3} mm safe margin; confirm with the printer.`, (B.labels || []).length ? "Small text and barcode in 100% K, overprinting." : "Small text in 100% K, overprinting.", "Finishes and dieline on separate layers, as spot colours.", "The dieline from the printer, not drawn by eye.", "A proof on the final paper before the colour is approved."];
  kids.push(tile(M + 1060 + G, TOP, CW - 1060 - G, CH2, inside([capOn(T.handoff), h("ol", { class: "n2", style: { marginTop: "16px", font: "400 20px/1.4 var(--text)" } }, steps.map((x) => h("li", { style: { marginBottom: "16px" } }, x)))], { top: "30px" }), { bg: feature.hex, text: true }));
  return [frame(kids, { cap: T.topics.print })];
};

/* The changelog sits with the files: which version of the book and the files someone is holding. */
const logTile = (x, w) => tile(x, TOP, w, CH2, inside([capOn(T.changelog), ...(B.changelog || []).slice(-6).reverse().map((c) => h("div", { style: { marginTop: "16px" } }, h("p", { class: "disp", style: { fontSize: "26px" } }, c.version), h("p", { class: "small soft" }, `${c.date}. ${c.change}`)))], { top: "30px" }), { bg: feature.hex, text: true });
S.files = (code) => {
  const groups = chunk(B.files || [], 9);
  if (!groups.length) groups.push([]);
  return groups.map((grp, gi) => {
    const showLog = gi === 0 && (B.changelog || []).length;
    const w = showLog ? CW - 520 - G : CW;
    const kids = [head(code, "files", gi === 0 ? (sec.files || T.topics.files) : `${T.topics.files}, ${T.more}`),
      tile(M, TOP, w, CH2, inside(h("table", { class: "tb" }, h("thead", {}, h("tr", {}, h("th", {}, T.filePath), h("th", {}, T.what), h("th", {}, T.printReady))),
        h("tbody", {}, grp.map((f) => h("tr", {}, h("td", { style: { width: showLog ? "420px" : "520px" } }, h("a", { href: asset(f.path) }, f.path)), h("td", {}, f.what), h("td", { style: { width: "150px" } }, f.print_ready === true ? T.yes : f.print_ready === false ? T.noWord : "–"))))), { top: "30px" }), { bg: "var(--panel)", text: true })];
    if (showLog) kids.push(logTile(M + w + G, 520));
    return frame(kids, { cap: T.topics.files });
  });
};

/* Decisions fill a slide by their estimated height, not by a fixed count: short ones fit ten to a slide. */
S.decisions = (code) => {
  const lines = (t, chars) => Math.max(1, Math.ceil(String(t || "").length / chars));
  const rowH = (x) => 20 + 23 * Math.max(lines(x.what, 30), lines(x.who, 22), lines(x.recommendation, 118));
  const groups = [[]];
  let used = 0;
  for (const x of B.decisions || []) {
    const hh = rowH(x);
    if (used + hh > CH2 - 120 && groups[groups.length - 1].length) { groups.push([]); used = 0; }
    groups[groups.length - 1].push(x);
    used += hh;
  }
  return groups.map((grp, gi) => frame([head(code, "decisions", gi === 0 ? (sec.decisions || T.topics.decisions) : `${T.topics.decisions}, ${T.more}`),
    tile(M, TOP, CW, CH2, inside(h("table", { class: "tb" }, h("thead", {}, h("tr", {}, h("th", {}, T.decWhat), h("th", {}, T.decWho), h("th", {}, T.decBy), h("th", {}, T.decRec))),
      h("tbody", {}, grp.map((x) => h("tr", {}, h("td", { style: { width: "320px" } }, x.what), h("td", { style: { width: "240px" } }, x.who || "?"), h("td", { style: { width: "130px" } }, x.by || "?"), h("td", {}, x.recommendation || ""))))), { top: "30px" }), { bg: "var(--panel)", text: true })], { cap: T.topics.decisions }));
};

/* ---------- the deck ---------- */
const main = document.getElementById("main");
const M0 = B.meta, s0 = B.strategy || {};
const hero = imgSlot("cover");
const tag = s0.tagline || M0.name;
const tagSize = tag.length > 60 ? 76 : tag.length > 34 ? 104 : 150;
main.append(frame([
  tile(M, M, CW, 690, [
    h("div", { class: "abs", style: { left: "48px", top: "44px" } }, logoImg(hero ? (logoFor((B.imagery || {}).hero_on) || featureLogo) : featureLogo, 260)),
    hero ? (hero.caption ? h("figcaption", { class: "chip", style: { left: "auto", right: "18px" } }, hero.caption) : null)
      : h("div", { class: "abs", style: { right: "44px", bottom: "44px", display: "flex", gap: "12px" } }, PAL.filter((c) => c !== feature).slice(0, 6).map((c) => h("div", { style: { width: "104px", height: "104px", borderRadius: "14px", background: c.hex, boxShadow: contrast(c.hex, feature.hex) < 1.3 ? "inset 0 0 0 1.5px rgba(255,255,255,.4)" : null } })))
  ], hero ? { img: hero.file, alt: hero.alt, generated: hero.generated, figure: true, pos: hero.pos } : { bg: feature.hex }),
  at(M - 4, 752, h("p", { class: "h-cover", style: { fontSize: px(tagSize), width: "1840px" } }, tag)),
  h("p", { class: "abs small", style: { left: px(M), bottom: "44px", color: "var(--ink-2)" } }, `Brandbook ${M0.version}, ${M0.date}, ${M0.status === "approved" ? T.approved : T.draft}${M0.owner ? `. ${T.owner}: ${M0.owner}` : ""}`)
], { id: "top", frameCls: "cover" }));

const tocItems = [];
const ORDER = [{ part: 1, items: ["strategy", "voice", "applications", "imagery"] }, { part: 2, items: ["logo", "colour", "type", "labels", "print", "files", "decisions"] }];
const has = { strategy: !!B.strategy, voice: !!B.voice, applications: (B.labels || []).length > 0 || (B.applications || []).length > 0, imagery: !!B.imagery, logo: !!(B.logo && primary), colour: colours.length > 0, type: !!B.type, labels: (B.labels || []).length > 0, print: !!B.print, files: (B.files || []).length > 0, decisions: true };
for (const part of ORDER) {
  const items = part.items.filter((id) => has[id]);
  if (!items.length) continue;
  // The divider names only the rules this book has: a service brand without labels doesn't promise them.
  const ruleList = ["logo", "colour", "type", "imagery", "labels", "print"].filter((id) => has[id]).map((id) => T.ruleWords[id]);
  const ruleText = ruleList.length > 1 ? `${ruleList.slice(0, -1).join(", ")} ${T.and} ${ruleList[ruleList.length - 1]}` : ruleList.join("");
  if (part.part === 2) main.append(frame([tile(M, M, CW, CH, [
    h("p", { class: "abs lead", style: { left: "76px", top: "70px", width: "760px", opacity: 0.82 } }, T.rulesLead(ruleText.charAt(0).toUpperCase() + ruleText.slice(1))),
    h("div", { class: "abs", style: { right: "80px", top: "70px" } }, logoImg(featureLogo, 300)),
    h("p", { class: "abs disp", style: { left: "70px", bottom: "56px", fontSize: "230px", lineHeight: 0.85 } }, T.part2)], { bg: feature.hex })], { frameCls: "part" }));
  let n = 0;
  items.forEach((id) => {
    const slides = S[id](`${part.part}.${n + 1}`);
    if (!slides.length) return;
    n++;
    main.append(h("section", { class: "s", id, "data-readers": READERS[id].join(" "), "aria-label": T.topics[id] }, slides));
    tocItems.push({ id, code: `${part.part}.${n}`, part: part.part, title: T.topics[id] });
  });
}
main.append(frame([tile(M, M, CW, CH, [
  h("p", { class: "abs disp", style: { left: "70px", top: "64px", width: "1500px", fontSize: tag.length > 34 ? "110px" : "200px", lineHeight: 0.92 } }, tag),
  h("div", { class: "abs", style: { right: "80px", bottom: "70px" } }, logoImg(featureLogo, 260)),
  h("p", { class: "abs small", style: { left: "76px", bottom: "70px", opacity: 0.75 } }, T.colophon(B))], { bg: feature.hex })], { frameCls: "closing" }));
document.querySelectorAll(".pno").forEach((p, i) => (p.textContent = i + 1));

/* ---------- viewer ---------- */
const frames = [...document.querySelectorAll(".frame")];
const fit = (fr) => { fr.firstElementChild.style.transform = `scale(${fr.clientWidth / 1920})`; };
const ro = new ResizeObserver((es) => es.forEach((e) => fit(e.target)));
frames.forEach((fr) => { ro.observe(fr); fit(fr); });
document.addEventListener("keydown", (e) => {
  if (!["ArrowDown", "ArrowUp", "PageDown", "PageUp"].includes(e.key) || (e.target.closest && e.target.closest("input, textarea"))) return;
  const visible = frames.filter((f) => f.offsetParent);
  const tops = visible.map((f) => f.getBoundingClientRect().top);
  const down = e.key === "ArrowDown" || e.key === "PageDown";
  const next = down ? visible.find((f, i) => tops[i] > 90) : [...visible].reverse().find((f, i, arr) => tops[visible.indexOf(f)] < 50);
  if (next) { e.preventDefault(); next.scrollIntoView({ block: "start" }); }
});
const toc = document.getElementById("toc"), menuLinks = document.getElementById("menu-links");
document.getElementById("menu-label").textContent = T.menu;
document.getElementById("skip").textContent = T.skip;
let lastPart = 0;
for (const it of tocItems) {
  if (it.part !== lastPart) { toc.append(h("p", {}, it.part === 1 ? T.part1 : T.part2)); lastPart = it.part; }
  toc.append(h("a", { href: `#${it.id}`, "data-for": it.id }, h("span", { class: "n" }, it.code), h("span", { class: "t2" }, it.title)));
  menuLinks.append(h("a", { href: `#${it.id}`, "data-for": it.id, onclick: () => (document.getElementById("menu").open = false) }, `${it.code} ${it.title}`));
}
toc.append(h("p", { class: "keys" }, T.keys));
document.getElementById("bar-brand").append(primary ? h("img", { src: asset(primary.file), alt: M0.name, "data-logo": "", "data-min-px": primary.min_px, style: { width: px(primary.min_px || 96) } }) : M0.name, h("span", {}, `brandbook ${M0.version}`));
const readersEl = document.getElementById("readers");
readersEl.setAttribute("aria-label", T.reader);
readersEl.append(h("span", { class: "lab" }, T.reader));
function setReader(r) {
  for (const b of readersEl.querySelectorAll("button")) b.setAttribute("aria-pressed", b.dataset.r === r ? "true" : "false");
  for (const s of main.querySelectorAll("section.s")) s.hidden = r !== "all" && !s.dataset.readers.split(" ").includes(r);
  const part = main.querySelector(".frame.part");
  if (part) part.hidden = r !== "all" && ![...main.querySelectorAll("section.s")].some((s) => !s.hidden && ORDER[1].items.includes(s.id));
  for (const a of document.querySelectorAll("[data-for]")) a.hidden = document.getElementById(a.dataset.for).hidden;
  const u = new URL(location.href); if (r === "all") u.searchParams.delete("reader"); else u.searchParams.set("reader", r);
  try { history.replaceState(null, "", u); } catch {}
}
for (const r of Object.keys(T.readers)) readersEl.append(h("button", { type: "button", "data-r": r, onclick: () => setReader(r) }, T.readers[r]));
const startReader = new URLSearchParams(location.search).get("reader");
setReader(T.readers[startReader] ? startReader : "all");
const links = [...toc.querySelectorAll("a")];
const spy = new IntersectionObserver((entries) => {
  for (const e of entries) if (e.isIntersecting) for (const a of links) a.setAttribute("aria-current", a.dataset.for === e.target.id ? "true" : "false");
}, { rootMargin: "-30% 0px -60% 0px" });
main.querySelectorAll("section.s").forEach((s) => spy.observe(s));
window.addEventListener("beforeprint", () => setReader("all"));
window.__bookReady = document.fonts.ready.then(() => true);
</script>
</body>
